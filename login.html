<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Back | FASHION.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Cairo:wght@400;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth">
    <a href="index.html" class="logo">FASHION.</a>

    <main class="auth-card">
      <h1>Welcome Back</h1>
      <p class="lead" dir="rtl">سجّل دخولك عشان تكمل التسوق.</p>

      <form id="authForm" data-auth="login" novalidate>
        <div class="field">
          <label for="email">Email</label
          ><input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
          /><small class="err"></small>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
            /><button type="button" class="toggle" data-toggle="password">
              Show
            </button>
          </div>
          <small class="err"></small>
        </div>
        <p class="form-msg" role="alert"></p>
        <button class="btn-primary" type="submit">Login</button>
      </form>

      <p class="switch">
        Don't have an account? <a href="signup.html">Create an account</a>
      </p>
    </main>

    <a href="index.html" class="back">← Back to store</a>
    <script src="auth.js"></script>
  </body>
</html>
